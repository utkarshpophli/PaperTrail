# Public entry point of the demo container. Runs unprivileged (uid 1000), so
# every writable path points at /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  # Backend caps uploads at 50 MB; leave room for the multipart envelope.
  client_max_body_size 55m;

  server {
    listen 7860;

    # API, prefix stripped. No X-Forwarded-For: the backend must see the
    # loopback peer (nginx), never a client-supplied address.
    location /api/ {
      proxy_pass http://127.0.0.1:8000/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Analysis progress is a Server-Sent Events stream that can run for many
      # minutes: never buffer it, never time it out early.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
